[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fcut-vla"
version = "0.1.0"
description = "Failure-conditioned transfer utility research pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "PyYAML>=6.0", "torch>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
